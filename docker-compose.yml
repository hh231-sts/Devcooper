services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devcooper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcooper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcooper}
      POSTGRES_DB: ${POSTGRES_DB:-devcooper}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - devcooper_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcooper} -d ${POSTGRES_DB:-devcooper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devcooper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - optional

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: devcooper-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - devcooper_etcd_data:/etcd

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: devcooper-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: silo server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devcooper_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: devcooper-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  devcooper_postgres_data:
  devcooper_etcd_data:
  devcooper_minio_data:
